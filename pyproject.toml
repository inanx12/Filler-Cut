[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fillercut"
version = "0.4.1"
description = "Konuşma analiziyle tamamlayıcı sözcükleri ve gereksiz sessizlikleri videodan kesen CLI aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "faster-whisper>=1",
    "rapidfuzz>=3",
    "rich>=13",
    # v1.0 web UI (yalnız bu ikisi — handoff kararı): v0.3 review server'ın
    # evrimi; stdlib http.server SSE + routing'de yetersiz. Şablon motoru /
    # htmx / npm YOK — arayüz statik HTML + vanilla JS + tek CSS.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # numpy YENİ bir bağımlılık DEĞİLDİR: faster-whisper/CTranslate2 zaten
    # kuruyordu. v1.0 review'un waveform peaks'i (web/waveform.py) onu ilk kez
    # DOĞRUDAN kullandığı için dolaylı→doğrudan terfi ettirildi — kullandığın
    # şeyi ilan et; üst zincir bir gün numpy'siz kalırsa hata burada görünsün.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    # FastAPI TestClient'ın zorunlu alt bağımlılığı (starlette.testclient
    # httpx üstüne kurulu; httpx yoksa TestClient import'u patlar). Yalnız
    # test bağımlılığıdır — runtime'a GİRMEZ.
    "httpx>=0.27",
]
# CUDA (RTX 4050): CTranslate2'nin yüklediği cuBLAS/cuDNN DLL'leri bu pip
# paketlerinden gelir — Windows'ta dizin kaydı fw_backend._register_nvidia_dll_dirs'de.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
fillercut = "fillercut.cli:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/fillercut"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: gerçek ffmpeg/ffprobe gerektirir — CI'da değil, kullanıcı makinesinde koşar (CI deselect: -m 'not ffmpeg')",
    "wcpp: gerçek whisper-cli binary + GGML model gerektirir — CI'da değil, kullanıcı makinesinde koşar (CI deselect: -m 'not wcpp')",
]
