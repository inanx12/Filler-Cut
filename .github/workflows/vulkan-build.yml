name: whisper-cli Vulkan build (Windows x64)

# whisper.cpp resmi release'lerinde Windows Vulkan paketi YOK (upstream
# ggml-org/whisper.cpp#3673) — sadece CPU, BLAS, CUDA var. Bu workflow o
# boşluğu Filler-Cut için doldurur: sabit tag'den kaynak derleme,
# vendor-agnostic Vulkan backend (tek binary ile NVIDIA/AMD/Intel).
# Kullanıcı tarafı: zip'i aç → config.toml'a whispercpp_binary + model yolu
# → backend = "whispercpp". Model dağıtımı YOK — kullanıcı HF'den indirir
# (ggerganov/whisper.cpp, ggml-large-v3-turbo-q5_0.bin).

on:
  workflow_dispatch:
    inputs:
      whispercpp_ref:
        description: "whisper.cpp tag/ref (sabit: v1.9.1; bilinçli değiştirilmedikçe dokunma)"
        required: true
        default: "v1.9.1"
  push:
    tags:
      - "v*"   # v0.3.0 gibi tag push'u → build + Releases sayfasına asset

# permissions: tag tetiklemesinde GITHUB_TOKEN ile release açıp asset yüklemek için
# (gh release create). Manuel dispatch'te release adımı koşmaz, izin zararsız.
permissions:
  contents: write

env:
  PACKAGE_NAME: fillercut-whisper-cli-vulkan-win-x64
  # Tag koşusunda github.ref_name = tag adı; dispatch'te whispercpp_ref input'u.
  TAG_NAME: ${{ github.ref_name }}
  WHISPERCPP_REF: ${{ inputs.whispercpp_ref || 'v1.9.1' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout whisper.cpp (sabit tag)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPERCPP_REF }}
          path: whisper.cpp

      - name: Vulkan SDK kur (LunarG)
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --silent `
            --accept-source-agreements --accept-package-agreements
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK kurulamadı (C:\VulkanSDK boş)" }
          echo "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=$($sdk.FullName)"

      - name: Configure (CMake, Vulkan ON)
        shell: pwsh
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          # GGML_NATIVE=OFF: dağıtım binary'si runner CPU'suna göre optimize
          # edilmesin, her x64 CPU'da çalışsın (upstream release deseni).
          # BUILD_SHARED_LIBS=ON: ggml DLL'leri ayrı üretilsin (zip'e girecek).

      - name: Build (whisper-cli)
        shell: pwsh
        run: cmake --build whisper.cpp/build --config Release --target whisper-cli -j

      - name: Smoke test 1 — binary çalışıyor mu
        shell: pwsh
        run: |
          # Runner'da GPU yok; --version backend init etmeden çıkar (v1.8.7+).
          & whisper.cpp\build\bin\Release\whisper-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli --version patladı" }

      - name: Smoke test 2 — uçtan uca transkripsiyon (CPU fallback)
        shell: pwsh
        run: |
          # tiny.en (~78 MB) + repo içindeki jfk.wav. Runner'da Vulkan sürücüsü
          # yok → ggml CPU backend'e düşer; amaç binary'nin bozuk olmadığını
          # kanıtlamak, hız ölçmek değil. Hız ölçümü kullanıcı donanımında
          # (RTX 4050) yapılır — bkz. KNOWN_ISSUES.md KI-1 deseni.
          curl -L -o ggml-tiny.en.bin `
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          & whisper.cpp\build\bin\Release\whisper-cli.exe `
            -m ggml-tiny.en.bin -f whisper.cpp\samples\jfk.wav -nt
          if ($LASTEXITCODE -ne 0) { throw "smoke transkripsiyon patladı" }

      - name: Paketle (exe + ggml DLL'leri + LICENSE)
        shell: pwsh
        run: |
          $bin = "whisper.cpp\build\bin\Release"
          $stage = "stage\$env:PACKAGE_NAME"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin\whisper-cli.exe" $stage
          # whisper.dll, ggml.dll, ggml-base.dll, ggml-cpu.dll, ggml-vulkan.dll
          Copy-Item "$bin\*.dll" $stage
          # MIT bile olsa binary dağıtımında lisans metni taşınmalı.
          Copy-Item whisper.cpp\LICENSE $stage
          Get-ChildItem $stage | Format-Table Name, Length
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:PACKAGE_NAME.zip"

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          retention-days: 30
          # Artifact her koşuda üretilir (manuel doğrulama için) ama 30 günde
          # silinir + indirmek GitHub hesabı ister — kalıcı dağıtım aşağıdaki
          # release adımıdır.

      - name: Release asset yükle (yalnız tag push'u)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh CLI runner'da yüklü gelir; üçüncü parti action yok.
          # --repo şart: whisper.cpp alt dizine checkout edildiği için cwd'de
          # Filler-Cut remote'u yok, gh hedef repo'yu buradan öğrenir.
          # Tag push'unda release henüz yok → create hem açar hem asset yükler.
          # --verify-tag: tag'in gerçekten repo'da olduğunu doğrular.
          $notes = @"
          whisper.cpp $($env:WHISPERCPP_REF) kaynak derlemesi, Windows x64, Vulkan backend.
          Vendor-agnostic: tek binary ile NVIDIA / AMD / Intel GPU.

          Kullanım:
          1. Zip'i indir, bir klasöre aç (whisper-cli.exe + ggml DLL'leri + LICENSE)
          2. Modeli HF'den indir: ggerganov/whisper.cpp -> ggml-large-v3-turbo-q5_0.bin
          3. filler-cut.toml: [asr] backend = "whispercpp",
             whispercpp_binary ve whispercpp_model yollarını yaz

          Not: ilk çalıştırmada ~10 sn tek seferlik shader derlemesi vardır
          (cache diske yazılır, sonraki koşular etkilenmez). Ölçümler:
          KNOWN_ISSUES.md KI-1 Vulkan koşusu.
          "@
          # Release zaten varsa create patlar ("already exists") — idempotent
          # ol: varsa asset'i --clobber ile güncelle, yoksa oluştur.
          if (gh release view $env:TAG_NAME --repo ${{ github.repository }} 2>$null) {
            gh release upload $env:TAG_NAME "$env:PACKAGE_NAME.zip" `
              --repo ${{ github.repository }} --clobber
          } else {
            gh release create $env:TAG_NAME "$env:PACKAGE_NAME.zip" `
              --repo ${{ github.repository }} `
              --title "whisper-cli Vulkan (Windows x64) — $env:TAG_NAME" `
              --notes $notes --verify-tag
          }
